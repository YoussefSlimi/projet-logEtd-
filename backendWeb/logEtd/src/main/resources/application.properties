spring.application.name=logEtd

spring.datasource.url=jdbc:postgresql://localhost:5432/logetd
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# L'authentification est JWT (stateless) : desactiver le UserDetailsService en memoire genere par Spring Security.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Hibernate crée d'abord les tables : Flyway doit se baseliner avant d'appliquer V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT (secret de developpement : a remplacer par une variable d'environnement en production)
app.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.access-token-ttl-seconds=900
app.jwt.refresh-token-ttl-seconds=604800

# Stockage local des photos d'annonces (chemin relatif au dossier du projet)
app.storage.photos-dir=uploads/photos
app.storage.max-photo-size-bytes=5242880

# Stockage local des preuves de paiement (images ou PDF)
app.storage.payment-proofs-dir=uploads/payment-proofs
app.storage.max-payment-proof-size-bytes=5242880

# Alerte admin : verification horaire des paiements declares depuis plus de 48 h
app.payment.alert-check-interval-ms=3600000

# Compte administrateur initial (developpement : a remplacer en production)
app.admin.bootstrap.enabled=true
app.admin.bootstrap.phone=+21600000000
app.admin.bootstrap.email=admin@logetd.local
app.admin.bootstrap.password=Admin123!
app.admin.bootstrap.fullName=Administrateur

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=80MB

server.port=8082
